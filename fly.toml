# Generated for lumen-server. Replace `app` with the unique name fly assigns
# you on `fly launch`. Singapore is the closest fly region to Quezon City, PH.

app = "lumen-server"
primary_region = "sin"

[build]

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # Keep the machine warm — WebSocket reconnects on cold-start are bad UX.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
