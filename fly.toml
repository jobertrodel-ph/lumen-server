# fly.toml app configuration file generated for lumen-eee-2026 on 2026-05-02T01:41:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lumen-eee-2026'
primary_region = 'sin'

[deploy]
  strategy = "immediate"

[build]

[env]
  PORT = '2567'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
